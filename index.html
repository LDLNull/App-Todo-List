<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App To-do list</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-bg">
  <header class="glass">
    <h1>App To-do list</h1>
  </header>

  <main class="animatedElements glass">
    
    <form id="taskForm" aria-label="Adicionar nova tarefa" class="glass">
      <input type="text" id="taskTitle" placeholder="Título da tarefa" required />
      <select id="taskPriority">
        <option value="alta">Alta</option>
        <option value="media">Média</option>
        <option value="baixa">Baixa</option>
      </select>
      <!-- optional due date/time -->
      <input type="datetime-local" id="taskDue" aria-label="Data e hora (opcional)" />
      <button type="submit">Adicionar</button>
    </form>

    
    <div class="fadeInElements" id="feedback" role="alert"></div>

    
    <section id="taskList" aria-live="polite"></section>

    <div id="loader" class="hidden">Carregando tarefas...</div>
  </main>
  
  

  </div>
  <script src="app.js"></script>
</body>
</html>
